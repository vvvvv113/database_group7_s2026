<script>
// ── Application Charts ──────────────────────────────────────────────────────

let _appStatusChart = null;
let _appTrendChart  = null;

async function loadApplicationCharts() {
  try {
    const [statusData, trendData] = await Promise.all([
      get("/api/stats/application-status"),
      get("/api/stats/application-trend"),
    ]);
    renderAppStatusChart(statusData);
    renderAppTrendChart(trendData);
  } catch (e) { /* non-critical */ }
}

function renderAppStatusChart(data) {
  const canvas = document.getElementById("app-status-chart");
  if (!canvas) return;
  if (_appStatusChart) { _appStatusChart.destroy(); _appStatusChart = null; }
  const colorMap = {
    approved: "#c8d5c5",
    rejected: "#949f97",
    declined: "#949f97",
    pending: "#ebe2aa",
  };
  _appStatusChart = new Chart(canvas, {
    type: "doughnut",
    data: {
      labels: data.map(d => d.status.charAt(0).toUpperCase() + d.status.slice(1)),
      datasets: [{
        data: data.map(d => d.count),
        backgroundColor: data.map(d => colorMap[d.status] || "#949f97"),
        borderWidth: 2,
        borderColor: "#f7f6ed",
      }],
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "bottom", labels: { padding: 16, color: "#66766d", font: { size: 12 } } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
              const pct = ((ctx.parsed / total) * 100).toFixed(1);
              return ` ${ctx.label}: ${ctx.parsed} (${pct}%)`;
            },
          },
        },
      },
      cutout: "60%",
    },
  });
}

function renderAppTrendChart(data) {
  const canvas = document.getElementById("app-trend-chart");
  if (!canvas) return;
  if (_appTrendChart) { _appTrendChart.destroy(); _appTrendChart = null; }
  _appTrendChart = new Chart(canvas, {
    type: "line",
    data: {
      labels: data.map(d => d.month),
      datasets: [{
        label: "Applications",
        data: data.map(d => d.count),
        borderColor: "#3e5148",
        backgroundColor: "rgba(200,213,197,.32)",
        fill: true,
        tension: 0.3,
        pointBackgroundColor: "#3e5148",
        pointRadius: 4,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: "rgba(100,120,109,.18)" },
          ticks: { stepSize: 1, color: "#66766d" },
        },
        x: {
          grid: { color: "rgba(100,120,109,.10)" },
          ticks: { font: { size: 11 }, color: "#66766d" },
        },
      },
    },
  });
}

// ── Application List ────────────────────────────────────────────────────────

async function loadApplicationList() {
  const wrap = document.getElementById("application-list-wrap");
  if (!wrap) return;
  showLoading(wrap);
  try {
    const items = await get("/api/applications");
    if (!items.length) { wrap.innerHTML = `<div class="empty-state"><p>No applications found.</p></div>`; return; }
    wrap.innerHTML = `
      <div class="record-grid application-grid">
        ${items.map(r => `
          <button class="record-card application-card" onclick="loadApplicationDetail(${r.application_id})">
            <div class="record-card-top">
              <span class="record-id">#${r.application_id}</span>
              ${statusBadge(r.status ?? "pending")}
            </div>
            <strong class="record-title">${fmt(r.experiment_title)}</strong>
            <div class="record-meta">
              <span>${statusBadge(r.application_type)}</span>
              <span>${fmt(r.applicant)}</span>
            </div>
            <div class="record-footer">
              <span>Submitted ${fmtDate(r.submit_time)}</span>
              <span>${fmtDate(r.required_start_date)} → ${fmtDate(r.required_end_date)}</span>
            </div>
            <span class="record-action">View details</span>
          </button>`).join("")}
      </div>`;
  } catch (e) { showError(wrap, e.message); }
}

async function loadApplicationDetail(id) {
  showApplicationDetailView();
  const panel = document.getElementById("application-detail-page");
  panel.innerHTML = `<div class="loading"><span class="spinner"></span>Loading…</div>`;
  try {
    const r = await get(`/api/applications/${id}`);
    const rev = r.review;
    const alloc = r.allocation;
    panel.innerHTML = `
      <div class="detail-toolbar">
        <button class="btn btn-secondary btn-sm" onclick="showApplicationListView()">← Back to Applications</button>
        <div class="breadcrumb">Applications / #${r.application_id}</div>
      </div>
      <div class="page-header">
        <h1>Application #${r.application_id}</h1>
        <p>Type: ${statusBadge(r.application_type)} · Submitted ${fmtDate(r.submit_time)}</p>
      </div>
      <div class="card">
        <div class="card-title">Basic Information</div>
        <div class="detail-grid">
          <div class="detail-field"><label>Applicant</label><span>${fmt(r.applicant_name)}</span></div>
          <div class="detail-field"><label>Email</label><span class="text-muted">${fmt(r.applicant_email)}</span></div>
          <div class="detail-field"><label>Supervising Staff</label><span>${fmt(r.staff_name)}</span></div>
          <div class="detail-field"><label>Experiment</label><span>${fmt(r.experiment_title)}</span></div>
          ${r.equipment_name ? `<div class="detail-field"><label>Equipment</label><span>${r.equipment_name}</span></div>` : ""}
          ${r.facility_name  ? `<div class="detail-field"><label>Facility</label><span>${r.facility_name}</span></div>` : ""}
          <div class="detail-field"><label>Requested Start</label><span>${fmtDate(r.required_start_date)}</span></div>
          <div class="detail-field"><label>Requested End</label><span>${fmtDate(r.required_end_date)}</span></div>
          <div class="detail-field"><label>Estimated Usage</label><span>${fmt(r.estimated_usage)}</span></div>
          <div class="detail-field"><label>Expected Outcome</label><span>${fmt(r.estimated_outcome)}</span></div>
        </div>
        ${r.safety_consideration ? `<div class="detail-field mt-8"><label>Safety Considerations</label><span>${fmt(r.safety_consideration)}</span></div>` : ""}
        ${r.special_note ? `<div class="detail-field mt-8"><label>Special Notes</label><span>${fmt(r.special_note)}</span></div>` : ""}
      </div>
      <div class="card">
        <div class="card-title">Review Decision</div>
        ${rev ? `
          <div class="detail-grid">
            <div class="detail-field"><label>Result</label><span>${statusBadge(rev.application_result ?? "pending")}</span></div>
            <div class="detail-field"><label>Justification</label><span>${fmt(rev.justification)}</span></div>
          </div>` : `<p class="text-muted">No review yet — application is pending.</p>`}
      </div>
      <div class="card">
        <div class="card-title">Actual Allocation</div>
        ${alloc ? `
          <div class="detail-grid">
            <div class="detail-field"><label>Allocation ID</label><span>#${alloc.allocation_id}</span></div>
            <div class="detail-field"><label>Start Date</label><span>${fmtDate(alloc.actual_start_date)}</span></div>
            <div class="detail-field"><label>End Date</label><span>${fmtDate(alloc.actual_end_date)}</span></div>
          </div>` : `<p class="text-muted">No actual allocation yet.</p>`}
      </div>`;
  } catch (e) { showError(panel, e.message); }
}

function showApplicationDetailView() {
  document.getElementById("application-list-page").style.display = "none";
  document.getElementById("application-detail-page").style.display = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showApplicationListView() {
  document.getElementById("application-detail-page").style.display = "none";
  document.getElementById("application-list-page").style.display = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ── Make Application Form ───────────────────────────────────────────────────

async function openMakeApplication() {
  document.getElementById("make-app-modal").classList.add("open");
  document.getElementById("make-app-form").reset();
  document.getElementById("app-form-error").textContent = "";
  toggleAppTypeFields();
  try {
    const fd = await get("/api/form-data");
    populateSelect("app-person",     fd.persons,     "person_id",     "full_name");
    populateSelect("app-experiment", fd.experiments, "experiment_id", "title");
    populateSelect("app-staff",      fd.staff,       "person_id",     "full_name");
    populateSelect("app-equipment",  fd.equipment,   "equipment_id",  "name",  true);
    populateSelect("app-facility",   fd.facilities,  "facility_id",   "name",  true);
  } catch (e) { showToast("Failed to load form data: " + e.message, "error"); }
}

function populateSelect(id, items, valKey, labelKey, blank = false) {
  const sel = document.getElementById(id);
  if (!sel) return;
  sel.innerHTML = (blank ? `<option value="">— Select —</option>` : "") +
    items.map(i => `<option value="${i[valKey]}">${i[labelKey]}</option>`).join("");
}

function toggleAppTypeFields() {
  const type = document.getElementById("app-type").value;
  document.getElementById("app-equipment-group").style.display = type === "equipment" ? "" : "none";
  document.getElementById("app-facility-group").style.display  = type === "facility"  ? "" : "none";
}

function showFormError(msg) {
  const el = document.getElementById("app-form-error");
  if (el) { el.textContent = msg; el.style.display = msg ? "block" : "none"; }
}

async function submitMakeApplication() {
  showFormError("");
  const type   = document.getElementById("app-type").value;
  const person = document.getElementById("app-person").value;
  const exp    = document.getElementById("app-experiment").value;
  const staff  = document.getElementById("app-staff").value;
  const start  = document.getElementById("app-start").value;
  const end    = document.getElementById("app-end").value;
  const safety = document.getElementById("app-safety").value.trim();
  const usage  = document.getElementById("app-usage").value.trim();
  const eqId   = document.getElementById("app-equipment").value;
  const facId  = document.getElementById("app-facility").value;

  // Frontend validation
  if (!person)  return showFormError("Please select an applicant.");
  if (!exp)     return showFormError("Please select an experiment.");
  if (!staff)   return showFormError("Please select supervising staff.");
  if (type === "equipment" && !eqId)  return showFormError("Please select an equipment.");
  if (type === "facility"  && !facId) return showFormError("Please select a facility.");
  if (!start)   return showFormError("Start date is required.");
  if (!end)     return showFormError("End date is required.");
  if (end < start) return showFormError("End date must be on or after start date.");
  if (!usage)   return showFormError("Estimated usage is required.");
  if (!safety)  return showFormError("Safety considerations are required.");

  const body = {
    person_id:             parseInt(person),
    experiment_id:         parseInt(exp),
    staff_id:              parseInt(staff),
    application_type:      type,
    required_start_date:   start,
    required_end_date:     end,
    safety_consideration:  safety,
    special_note:          document.getElementById("app-note").value || null,
    estimated_usage:       usage,
    estimated_outcome:     document.getElementById("app-outcome").value || null,
    equipment_id:  type === "equipment" ? parseInt(eqId)  : null,
    facility_id:   type === "facility"  ? parseInt(facId) : null,
  };

  try {
    const result = await post("/api/applications", body);
    closeMakeApplication();
    showToast(`Application #${result.application_id} submitted successfully.`);
    loadApplicationList();
    loadApplicationCharts();
  } catch (e) { showFormError("Server error: " + e.message); }
}

function closeMakeApplication() {
  document.getElementById("make-app-modal").classList.remove("open");
}
function closeMakeApplicationModal() { closeMakeApplication(); }
</script>
